<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <!-- DER gerado a partir de der-task-manager.drawio (alinhado ao Aula05/schema.sql) -->
  <rect width="940" height="420" fill="#ffffff"/>
  <text x="470" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Diagrama Entidade-Relacionamento (DER) — Banco de Dados: task_manager (Aula 05)</text>

  <!-- Tabela users -->
  <g transform="translate(80, 120)" font-size="12" fill="#1e293b">
    <rect width="280" height="240" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
    <rect width="280" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="140" y="20" text-anchor="middle" font-size="14" font-weight="bold">users</text>
    <g stroke="#e2e8f0">
      <line x1="0" y1="60" x2="280" y2="60"/>
      <line x1="0" y1="90" x2="280" y2="90"/>
      <line x1="0" y1="120" x2="280" y2="120"/>
      <line x1="0" y1="150" x2="280" y2="150"/>
      <line x1="0" y1="180" x2="280" y2="180"/>
      <line x1="0" y1="210" x2="280" y2="210"/>
    </g>
    <text x="10" y="50" font-weight="bold">🔑 PK  id : SERIAL (INTEGER)</text>
    <text x="34" y="80">name : VARCHAR(100) NOT NULL</text>
    <text x="34" y="110">username : VARCHAR(50) UNIQUE</text>
    <text x="34" y="140">email : VARCHAR(100) UNIQUE NOT NULL</text>
    <text x="34" y="170">password : VARCHAR(255)</text>
    <text x="34" y="200">password_hash : VARCHAR(255)</text>
    <text x="34" y="230">created_at : TIMESTAMPTZ DEFAULT NOW()</text>
  </g>

  <!-- Tabela tasks -->
  <g transform="translate(540, 100)" font-size="12" fill="#1e293b">
    <rect width="360" height="270" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/>
    <rect width="360" height="30" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
    <text x="180" y="20" text-anchor="middle" font-size="14" font-weight="bold">tasks</text>
    <g stroke="#e2e8f0">
      <line x1="0" y1="60" x2="360" y2="60"/>
      <line x1="0" y1="90" x2="360" y2="90"/>
      <line x1="0" y1="120" x2="360" y2="120"/>
      <line x1="0" y1="150" x2="360" y2="150"/>
      <line x1="0" y1="180" x2="360" y2="180"/>
      <line x1="0" y1="210" x2="360" y2="210"/>
      <line x1="0" y1="240" x2="360" y2="240"/>
    </g>
    <text x="10" y="50" font-weight="bold">🔑 PK  id : SERIAL (INTEGER)</text>
    <text x="10" y="80" font-style="italic">🔗 FK  user_id : INTEGER NOT NULL (ON DELETE CASCADE)</text>
    <text x="34" y="110">title : VARCHAR(255) NOT NULL</text>
    <text x="34" y="140">description : TEXT</text>
    <text x="34" y="170">status : VARCHAR(50) DEFAULT 'pendente'</text>
    <text x="34" y="200">completed : BOOLEAN DEFAULT FALSE</text>
    <text x="34" y="230">due_date : DATE</text>
    <text x="34" y="260">created_at : TIMESTAMPTZ DEFAULT NOW()</text>
  </g>

  <!-- Relacionamento 1:N: users.id (um) -> tasks.user_id (zero ou muitos) -->
  <g stroke="#333333" stroke-width="2" fill="none">
    <path d="M 360 135 L 450 135 L 450 175 L 540 175"/>
    <!-- lado users: exatamente um (duas barras) -->
    <line x1="370" y1="127" x2="370" y2="143"/>
    <line x1="378" y1="127" x2="378" y2="143"/>
    <!-- lado tasks: zero ou muitos (círculo + pé de galinha) -->
    <circle cx="516" cy="175" r="5" fill="#ffffff"/>
    <line x1="526" y1="175" x2="540" y2="166"/>
    <line x1="526" y1="175" x2="540" y2="184"/>
  </g>
  <rect x="400" y="143" width="100" height="24" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="450" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">possui (1 : N)</text>
</svg>
